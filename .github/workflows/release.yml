name: Release 🚀

# Publishes the version in package.json once its release PR (`chore(release): vX.Y.Z`, opened by the
# release skill in .claude/skills/release/SKILL.md) is merged into main. Every other push to main finds
# nothing to do: its version is already fully released, or CHANGELOG.md has no section for it.
# Every step checks before it acts, so a re-run (or a dispatch on the same commit) finishes a partial
# release without duplicating anything. The logic lives in .github/scripts/release_*.py. Decision record: docs/adr/0012-release-pr-then-publish-on-merge.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the vX.Y.Z tag and the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance: no long-lived npm token

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm, tag and create the GitHub release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # The npm of devEngines in package.json. Trusted publishing needs npm 11.5.1 or later.
      - name: Install the npm version of package.json devEngines
        run: npm install -g npm@11.21.3

      - name: Find what is left to release
        id: check
        run: python3 .github/scripts/release_check.py

      # Not setup-node's `cache: npm`: it runs `npm config get cache` with the runner's npm,
      # which devEngines in package.json refuses. Cached here, after the pinned npm is installed.
      - name: Cache the npm download cache
        if: steps.check.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies from package-lock.json
        if: steps.check.outputs.work == 'true'
        run: npm ci

      # Nothing is published unless lint, typecheck, tests and build pass.
      - name: Lint, typecheck and run tests
        if: steps.check.outputs.work == 'true'
        run: npm run verify

      - name: Build into dist/
        if: steps.check.outputs.work == 'true'
        run: npm run build

      # Diagnostic: npm trusted publishing needs an OIDC token whose claims match the trusted
      # publisher on npmjs.com. Prints the claims npm compares, never the token itself.
      - name: Check the OIDC token for npm trusted publishing
        if: steps.check.outputs.work == 'true' && steps.check.outputs.npm_needed == 'true'
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No OIDC token available to this job: id-token: write is not granted."
            exit 1
          fi
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | python3 -c '
          import base64, json, sys
          token = json.load(sys.stdin)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for key in ("aud", "repository", "repository_owner", "workflow_ref", "ref", "event_name", "environment"):
              print(key + ": " + str(claims.get(key, "(none)")))
          '

      # --loglevel verbose shows whether npm published with OIDC or fell back to NODE_AUTH_TOKEN.
      - name: Publish to npm with provenance
        id: npm
        if: steps.check.outputs.work == 'true' && steps.check.outputs.npm_needed == 'true'
        run: npm publish --provenance --access public --loglevel verbose

      - name: Create the tag on the merge commit
        id: tag
        if: steps.check.outputs.work == 'true' && steps.check.outputs.tag_needed == 'true'
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/${{ steps.check.outputs.tag }}" -f sha="$GITHUB_SHA"

      - name: Create the GitHub release
        id: release
        if: steps.check.outputs.work == 'true' && steps.check.outputs.release_needed == 'true'
        run: >-
          gh release create "${{ steps.check.outputs.tag }}"
          --verify-tag
          --title "${{ steps.check.outputs.tag }}"
          --notes-file "${{ steps.check.outputs.notes_file }}"

      - name: Write the job summary
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          REASON: ${{ steps.check.outputs.reason }}
          TAG: ${{ steps.check.outputs.tag }}
          WORK: ${{ steps.check.outputs.work }}
          NPM_NEEDED: ${{ steps.check.outputs.npm_needed }}
          TAG_NEEDED: ${{ steps.check.outputs.tag_needed }}
          RELEASE_NEEDED: ${{ steps.check.outputs.release_needed }}
          NPM_OUTCOME: ${{ steps.npm.outcome }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: python3 .github/scripts/release_summary.py
