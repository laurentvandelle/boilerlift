name: Release 🚀

# Publishes the version in package.json. Only dispatched, never run by a push: the release skill in
# .claude/skills/release/SKILL.md dispatches it on main once its release PR (`chore(release): vX.Y.Z`)
# is merged and the maintainer asks to publish. It does nothing when the version is already fully
# released, or when CHANGELOG.md has no section for it.
# Every step checks before it acts, so a re-run (or a dispatch on the same commit) finishes a partial
# release without duplicating anything. The logic lives in .github/scripts/release_*.py and template_*.py.
# Decision records: docs/adr/0013-release-workflow-dispatched-by-the-skill.md and
# docs/adr/0019-boilerlift-release-tags-the-project-template.md.
#
# Before `npm publish`, a fresh project from the Template branch of boilerlift-template is checked against
# the packed boilerlift, and that same .tgz is published. After the boilerlift tag and GitHub release,
# boilerlift-template main is fast-forwarded to the checked SHA, set to "boilerlift": "^X.Y.Z" and tagged vX.Y.Z.
on:
  workflow_dispatch:
    inputs:
      template_branch:
        description: The boilerlift-template branch this release ships (main when it does not exist)
        type: string
        default: main

permissions:
  contents: write # create the vX.Y.Z tag and the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance: no long-lived npm token

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm, tag, create the GitHub release and tag boilerlift-template
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # The npm of devEngines in package.json. Trusted publishing needs npm 11.5.1 or later.
      - name: Install the npm version of package.json devEngines
        run: npm install -g npm@11.21.3

      - name: Find what is left to release
        id: check
        run: python3 .github/scripts/release_check.py

      # Not setup-node's `cache: npm`: it runs `npm config get cache` with the runner's npm,
      # which devEngines in package.json refuses. Cached here, after the pinned npm is installed.
      - name: Cache the npm download cache
        if: steps.check.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies from package-lock.json
        if: steps.check.outputs.work == 'true'
        run: npm ci

      # Nothing is published unless lint, typecheck, tests and build pass.
      - name: Lint, typecheck and run tests
        if: steps.check.outputs.work == 'true'
        run: npm run verify

      - name: Build into dist/
        if: steps.check.outputs.work == 'true'
        run: npm run build

      # Packed once: the fresh-project check installs this .tgz and npm publishes it, so what is checked is what ships.
      - name: Pack boilerlift
        id: pack
        if: steps.check.outputs.work == 'true'
        run: echo "tgz=$RUNNER_TEMP/$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"

      # Resolves template_branch to one SHA and fails unless it fast-forwards boilerlift-template main.
      - name: Create a fresh project from the Template branch
        id: template
        if: steps.check.outputs.work == 'true'
        env:
          MODE: release
          TEMPLATE_BRANCH: ${{ inputs.template_branch }}
          VERSION: ${{ steps.check.outputs.version }}
          TEMPLATE_NEEDED: ${{ steps.check.outputs.template_needed }}
        run: python3 .github/scripts/template_branch.py

      - name: Install the packed boilerlift in the fresh project
        if: steps.check.outputs.work == 'true'
        working-directory: ${{ steps.template.outputs.dir }}
        run: npm install --save-dev "${{ steps.pack.outputs.tgz }}"

      - name: Install the fresh project's dependencies
        if: steps.check.outputs.work == 'true'
        working-directory: ${{ steps.template.outputs.dir }}
        run: npm install

      # Nothing is published or tagged, in either repository, unless the fresh project passes.
      - name: Lint, typecheck and test the fresh project
        if: steps.check.outputs.work == 'true'
        working-directory: ${{ steps.template.outputs.dir }}
        run: npm run verify

      # --loglevel verbose logs the OIDC token exchange ("npm verbose oidc ..."): on an E404, it says whether
      # npmjs.com matched the trusted publisher.
      - name: Publish to npm with provenance
        id: npm
        if: steps.check.outputs.work == 'true' && steps.check.outputs.npm_needed == 'true'
        run: npm publish "${{ steps.pack.outputs.tgz }}" --provenance --access public --loglevel verbose

      - name: Create the tag on the released commit
        id: tag
        if: steps.check.outputs.work == 'true' && steps.check.outputs.tag_needed == 'true'
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/${{ steps.check.outputs.tag }}" -f sha="$GITHUB_SHA"

      - name: Create the GitHub release
        id: release
        if: steps.check.outputs.work == 'true' && steps.check.outputs.release_needed == 'true'
        run: >-
          gh release create "${{ steps.check.outputs.tag }}"
          --verify-tag
          --title "${{ steps.check.outputs.tag }}"
          --notes-file "${{ steps.check.outputs.notes_file }}"

      # A short-lived token of the GitHub App installed on boilerlift-template only (secrets in the release skill's setup).
      - name: Mint a boilerlift-template token
        id: app
        if: steps.check.outputs.work == 'true' && steps.check.outputs.template_needed == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TEMPLATE_APP_ID }}
          private-key: ${{ secrets.TEMPLATE_APP_PRIVATE_KEY }}
          owner: laurentvandelle
          repositories: boilerlift-template

      - name: Fast-forward, set the version and tag boilerlift-template
        id: template_release
        if: steps.check.outputs.work == 'true' && steps.check.outputs.template_needed == 'true'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ steps.check.outputs.version }}
          SHA: ${{ steps.template.outputs.sha }}
          BRANCH: ${{ steps.template.outputs.branch }}
        run: python3 .github/scripts/template_release.py

      - name: Write the job summary
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          REASON: ${{ steps.check.outputs.reason }}
          TAG: ${{ steps.check.outputs.tag }}
          WORK: ${{ steps.check.outputs.work }}
          NPM_NEEDED: ${{ steps.check.outputs.npm_needed }}
          TAG_NEEDED: ${{ steps.check.outputs.tag_needed }}
          RELEASE_NEEDED: ${{ steps.check.outputs.release_needed }}
          TEMPLATE_NEEDED: ${{ steps.check.outputs.template_needed }}
          NPM_OUTCOME: ${{ steps.npm.outcome }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          TEMPLATE_OUTCOME: ${{ steps.template_release.outcome }}
        run: python3 .github/scripts/release_summary.py
